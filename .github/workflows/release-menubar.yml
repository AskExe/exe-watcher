name: Build macOS Menubar Review Artifact

# Review builds are deliberately manual. Public releases are built, signed, notarized and
# published from the authorized release Mac through mac/Scripts/publish-release.mjs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the review bundle (for example, dev-preview)'
        required: true
        default: 'dev-preview'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate review source
        run: |
          npm run build
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.cloud.json
          npx vitest run
          swift test --package-path mac --filter ExeWatcherMenubarTests

      - name: Build self-contained review app, zip and disk image
        env:
          VERSION_LABEL: ${{ inputs.version }}
        run: mac/Scripts/package-app.sh "${VERSION_LABEL}"

      - name: Upload review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExeWatcherMenubar-${{ inputs.version }}
          path: |
            mac/.build/dist/ExeWatcherMenubar-*.zip
            mac/.build/dist/Watcher-*.dmg
            mac/.build/dist/SHA256SUMS.txt
            mac/.build/dist/BUILD-INFO.txt
          if-no-files-found: error
