name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test the minimum supported SQLite runtime and latest Node 22.
        # Match the Node 22 floor in engines.node (22.13.0). ink@7 requires
        # node >=22 and tsup builds for target node22, so 18 and 20 cannot run
        # the CLI at all — testing them was testing something we do not ship.
        node-version: [22.13.0, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=verbose

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.cloud.json

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

      - name: Paired app and npm release checks
        run: npm run test:release

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep bracket-assign guard
        run: |
          set -e
          semgrep --config .semgrep/rules/no-bracket-assign-hot-paths.yml \
            --strict --timeout 30 --json \
            src/ > semgrep-out.json
          FINDINGS=$(jq '.results | length' semgrep-out.json)
          if [ "$FINDINGS" -gt 0 ]; then
            jq -r '.results[] | "::error file=\(.path),line=\(.start.line)::\(.extra.message)"' semgrep-out.json
            exit 1
          fi

  macos-resource-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --loglevel=verbose
      - name: Scheduler, cancellation, output budgets, and cache isolation
        run: swift test --package-path mac --filter ExeWatcherMenubarTests
      - name: Build and verify signed macOS package
        run: mac/Scripts/package-app.sh ci

      - name: Retain the tested Mac app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watcher-mac-tested
          path: mac/.build/dist/ExeWatcherMenubar-ci.zip
          if-no-files-found: error
          retention-days: 3
